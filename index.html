<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunPage – Off-Grid Solar Planner</title>
    <meta name="description" content="Size, simulate and budget an off-grid solar + battery system for a 400 A home in Victoria, BC.">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>☀️</text></svg>">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <span class="logo" aria-hidden="true">☀️</span>
            <h1>SunPage</h1>
            <span class="subtitle">Off-grid solar + battery planner · Victoria, BC</span>
        </div>
        <div class="header-actions">
            <span class="status" id="statusBadge" role="status"><span class="dot"></span><span id="statusText">Checking…</span></span>
            <button class="btn-ghost only-narrow" id="settingsBtn" type="button" aria-controls="controlPanel">Settings</button>
            <button class="btn-ghost" id="resetBtn" type="button" title="Restore every setting to its default">Reset</button>
            <button class="btn-ghost only-wide" id="printBtn" type="button">Print</button>
        </div>
    </header>

    <div class="app-layout">
        <!-- Built from SunSettings.SCHEMA by ui/controls.js -->
        <aside class="control-panel" id="controlPanel" aria-label="Settings"></aside>

        <main class="content">
            <!-- Built from the tab registry by app.js; one file per tab in ui/tabs/ -->
            <nav class="tabs" id="tabs" role="tablist"></nav>
            <div id="view"></div>
        </main>
    </div>

    <!-- Calculation (no DOM) -->
    <script src="data.js"></script>
    <script src="engine.js"></script>
    <script src="budget.js"></script>
    <script src="settings.js"></script>
    <!-- Interface -->
    <script src="charts.js"></script>
    <script src="ui/ui.js"></script>
    <script src="ui/model.js"></script>
    <script src="ui/controls.js"></script>
    <script src="ui/sld.js"></script>
    <script src="ui/tabs/overview.js"></script>
    <script src="ui/tabs/energy.js"></script>
    <script src="ui/tabs/generator.js"></script>
    <script src="ui/tabs/optimizer.js"></script>
    <script src="ui/tabs/budget.js"></script>
    <script src="ui/tabs/assumptions.js"></script>
    <script src="app.js"></script>
</body>
</html>
